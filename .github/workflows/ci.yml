name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: the E1 series is a stack of PRs
  # whose bases are each other's branches, and each must be gated.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PG 16 + pgvector, the versions the kernel schema targets.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epigraph
          POSTGRES_PASSWORD: epigraph
          POSTGRES_DB: postgres
        # Host port 5433: the test harness refuses 5432 unconditionally, here
        # as everywhere (scripts/e1-test-db.sh, tests/support/mod.rs).
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: "true"
      PGPASSWORD: epigraph
      # Admin DSN of the TEST cluster; every database the suite touches is a
      # `<run prefix>_…_test` clone built from it by scripts/e1-test-db.sh.
      E1_TEST_ADMIN_URL: postgres://epigraph:epigraph@127.0.0.1:5433/postgres
      E1_KERNEL_TOOLS_DIR: ${{ github.workspace }}/.e1-kernel-tools
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Derive the pinned kernel rev from Cargo.lock
        id: kernel
        run: |
          revs=$(grep -o 'git+https://github.com/epigraph-io/epigraph?rev=[0-9a-f]\{40\}' Cargo.lock | sed 's/.*rev=//' | sort -u)
          test "$(printf '%s\n' "$revs" | wc -l)" -eq 1 || { echo "Cargo.lock pins more than one kernel rev"; exit 1; }
          echo "rev=$revs" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4.3.1
        name: Checkout the kernel at the pinned rev
        with:
          repository: epigraph-io/epigraph
          ref: ${{ steps.kernel.outputs.rev }}
          path: upstream-epigraph

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          workspaces: |
            .
            upstream-epigraph

      - name: Admin-URL refusals of scripts/e1-test-db.sh (no database)
        run: scripts/e1-test-db-selftest.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the kernel's epigraph-migrate and server at the pinned rev
        working-directory: upstream-epigraph
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          KREV: ${{ steps.kernel.outputs.rev }}
        run: |
          [[ "$KREV" =~ ^[0-9a-f]{40}$ ]] || { echo "bad kernel rev"; exit 1; }
          cargo build --locked --bin epigraph-migrate --bin server
          dest="$E1_KERNEL_TOOLS_DIR/epigraph-migrate-$KREV/bin"
          mkdir -p "$dest"
          cp target/debug/epigraph-migrate "$dest/"

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests (fresh kernel schema per run, clone per test; kernel sidecar on :8090)
        run: |
          scripts/e1-test-db.sh ci -- \
            scripts/ci-run-tests.sh "$GITHUB_WORKSPACE/upstream-epigraph/target/debug/server" \
            -- --test-threads=4

      - name: episcience-migrate verify against a fresh template
        run: |
          scripts/e1-test-db.sh ci -- bash -c \
            'env -u DATABASE_URL EPISCIENCE_MIGRATION_DATABASE_URL="${E1_TEST_ADMIN_URL%/*}/$E1_TEMPLATE_DB" cargo run -q --bin episcience-migrate -- verify'
