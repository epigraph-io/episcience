[package]
name = "episcience-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EpiScience ELN REST API server"

[[bin]]
name = "episcience-server"
path = "src/bin/server.rs"

[[bin]]
name = "episcience-mcp-server"
path = "src/bin/episcience-mcp-server.rs"

[[bin]]
name = "episcience-migrate"
path = "src/bin/episcience-migrate.rs"

[[bin]]
name = "episcience-maint"
path = "src/bin/episcience-maint.rs"

[[bin]]
name = "episcience-worker"
path = "src/bin/episcience-worker.rs"

[dependencies]
episcience-core.workspace = true
episcience-db.workspace = true
epigraph-core.workspace = true
epigraph-crypto.workspace = true
ed25519-dalek.workspace = true
epigraph-db.workspace = true
epigraph-auth.workspace = true
epigraph-jobs.workspace = true
epigraph-cli.workspace = true
epigraph-embeddings.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
sqlx.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
rmcp.workspace = true
schemars.workspace = true
tower-http = { version = "0.5", features = ["cors"] }
# Unix-socket MCP HTTP transport: axum 0.7's `serve` is hardcoded to TcpListener
# (the generic Listener trait only landed in axum 0.8), so the `unix:` listener
# is hand-rolled with a hyper-util auto accept loop. Already in the lockfile
# transitively via axum 0.7, so this pins an existing version.
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
axum-extra = { version = "0.9", features = ["multipart"] }
hex = "0.4"
printpdf.workspace = true
jsonwebtoken.workspace = true
async-trait.workspace = true
base64 = { workspace = true }

[dev-dependencies]
# HTTP client for the tests that drive the servers over the network. Not a
# direct runtime dependency: since the retired service client was deleted
# (E1h), no code in this crate makes an HTTP call (the kernel's embedding and
# LLM provider crates carry their own client).
reqwest = { workspace = true }
wiremock = "0.6"
axum-test = "14"
epigraph-engine.workspace = true
epigraph-embeddings.workspace = true
epigraph-db.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
uuid = { workspace = true }
chrono = { workspace = true }
episcience-core.workspace = true
episcience-db.workspace = true
async-trait.workspace = true
tempfile = "3"
regex.workspace = true

[[test]]
name = "phase01_e2e_test"
path = "tests/phase01_e2e_test.rs"

[[test]]
name = "synthesis_job_handler_test"
path = "tests/synthesis_job_handler_test.rs"

[[test]]
name = "syntheses_routes_test"
path = "tests/syntheses_routes_test.rs"

[[test]]
name = "protocols_routes_test"
path = "tests/protocols_routes_test.rs"

[[test]]
name = "synthesis_search_test"
path = "tests/synthesis_search_test.rs"

[[test]]
name = "mcp_tools_test"
path = "tests/mcp_tools_test.rs"

[[test]]
name = "mcp_write_tools_test"
path = "tests/mcp_write_tools_test.rs"
