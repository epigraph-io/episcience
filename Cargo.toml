[workspace]
resolver = "2"
members = [
    "crates/episcience-core",
    "crates/episcience-db",
    "crates/episcience-api",
    "crates/episcience-filer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[workspace.dependencies]
# EpiGraph kernel pin. ONE rev for every kernel crate; `docs/kernel-pin.md`
# records the sha, its maximum kernel migration and the rule for moving it:
# the pin target's max kernel migration must be <= the PROD kernel head at
# deploy time (EpiScience's schema is built on top of the kernel's, and the
# kernel migrator refuses a database it is behind). The CI kernel checkout and
# `scripts/e1-test-db.sh` derive the rev from Cargo.lock, never a second
# hard-coded sha.
#
# Local development: override by adding to your personal ~/.cargo/config.toml:
#   [patch."https://github.com/epigraph-io/epigraph"]
#   epigraph-core = { path = "/abs/path/to/your/epigraph/crates/epigraph-core" }
#   ... (etc for each crate you want to override)
# Don't commit personal patches — keep the committed values CI-canonical.
epigraph-core        = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-auth        = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-crypto      = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-db          = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-engine      = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-cli         = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-jobs        = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-events      = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }
epigraph-embeddings  = { git = "https://github.com/epigraph-io/epigraph", rev = "ffeb7bb3a2eea58ae31069d9022e6012ec5a4ee7" }

# Internal crates
episcience-core = { path = "crates/episcience-core" }
episcience-db = { path = "crates/episcience-db" }

# Shared dependencies — mirror EpiGraph's pinned versions
# Countersignature verification: the STRICT Ed25519 check (the same major
# version the kernel pins; resolves to the locked release).
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls", "macros", "migrate"
] }
axum = { version = "0.7", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
printpdf = "0.7"
# The kernel's jsonwebtoken (epigraph-auth uses 10.x with `rust_crypto`; same
# version and features, so it adds no crate to the lock), and the only copy in
# the workspace: the MCP listener's extension-audience validator, which must
# decode exactly as `epigraph_auth::JwtConfig` does
# (`mcp::http::ExtensionAudienceValidator`), and the tests' token minting.
# `episcience-core/tests/dependency_security_floor.rs` holds it at >= 10.3.0.
jsonwebtoken-kernel = { package = "jsonwebtoken", version = "10.3", features = ["rust_crypto"] }
async-trait = "0.1"
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pgvector = { version = "0.4", features = ["sqlx"] }
regex = "1"
base64 = "0.22"
